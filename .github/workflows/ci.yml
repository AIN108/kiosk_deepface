name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qt-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries for Qt (offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m py_compile run_project.py ksitscma-sef/*.py
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
